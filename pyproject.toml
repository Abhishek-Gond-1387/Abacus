[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abacus-verifier"
version = "0.1.0"
description = "A research prototype for checking precise claims about Python functions"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
abacus-day6 = "abacus.day6_demo:main"

[tool.setuptools.packages.find]
where = ["src"]
