[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abacus-verifier"
version = "0.1.0"
description = "A research prototype for checking precise claims about Python functions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "hypothesis==6.170.14",
    "openai>=1.66.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
abacus = "abacus.cli:main"
abacus-day6 = "abacus_legacy.day6_demo:main"

[tool.setuptools]
packages = ["abacus", "abacus_legacy", "practice"]

[tool.setuptools.package-dir]
abacus = "abacus"
abacus_legacy = "src/abacus"
practice = "practice"
