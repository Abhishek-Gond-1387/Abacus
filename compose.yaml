services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: abacus
      POSTGRES_USER: abacus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.api}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  abacus-api:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ABACUS_PORT:-8000}:8000"
    environment:
      ABACUS_API_KEY: ${ABACUS_API_KEY:?Set ABACUS_API_KEY in .env.api}
      ABACUS_DATABASE_URL: "postgresql+psycopg://abacus:${DB_PASSWORD:?Set DB_PASSWORD in .env.api}@postgres:5432/abacus"
      ABACUS_DATA_DIR: /data
      ABACUS_RUNS_DIR: /data/runs
    volumes:
      - abacus-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  abacus-data:
  postgres-data:
