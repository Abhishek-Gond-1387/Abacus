name: Python regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-ci.txt

      - name: Lint YAML configuration
        run: yamllint --strict .github/workflows/ci.yml .github/dependabot.yml compose.yaml

      - name: Run regression suites
        run: python practice/run_test_suites.py

  postgres-integration:
    name: PostgreSQL integration / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: abacus_test
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus -d abacus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ABACUS_TEST_POSTGRES_URL: postgresql+psycopg://abacus:abacus-test-password@127.0.0.1:5432/abacus_test
      ABACUS_API_KEY: postgres-ci-api-key-that-is-long-enough-for-integration-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run live PostgreSQL API and integrity checks
        run: python -m unittest practice.test_postgres_integration -v

      - name: Lint GitHub workflow YAML
        run: yamllint --strict .github/workflows/ci.yml .github/dependabot.yml compose.yaml
